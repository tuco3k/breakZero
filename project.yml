# XcodeGen spec. Generate with `xcodegen generate`; never hand-edit the .pbxproj (git-ignored).
# Verified 2026-10-01 on macOS (Xcode 27, XcodeGen 2.46): both variants generate and build.
#
# Before building on a device, set your team and (if needed) identifiers in one place:
#   DEVELOPMENT_TEAM, BZ_BUNDLE_ID, BZ_APP_GROUP below — and AppGroup.appGroupID in
#   Packages/BreakZeroKit/Sources/Core/SharedStore.swift must match BZ_APP_GROUP.
#
# Screen Time switch (generate time). This file alone is the lite app: no Screen Time extensions,
# no entitlements at all (so a free Personal Team can sign it), and app code without the
# BZ_SCREEN_TIME Swift flag, so every Screen Time call is compiled out.
#   xcodegen generate                      → lite app (default)
#   BZ_SCREEN_TIME=YES xcodegen generate   → full app: adds project-screen-time.yml (the three
#                                            extensions, Family Controls + App Group entitlements)
# XcodeGen has no default for an unset variable, so unset has to mean "off".
name: breakZero

include:
  - path: project-screen-time.yml
    enable: ${BZ_SCREEN_TIME}

options:
  bundleIdPrefix: com.tuco3k
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    BZ_BUNDLE_ID: com.tuco3k.breakzero
    BZ_APP_GROUP: group.com.tuco3k.breakzero
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  BreakZeroKit:
    path: Packages/BreakZeroKit

targets:
  breakZero:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - package: BreakZeroKit
        product: Core
      - package: BreakZeroKit
        product: LiteWeb
      - package: BreakZeroKit
        product: Shielding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BZ_BUNDLE_ID)
        PRODUCT_NAME: breakZero
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: breakZero
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BZAppGroup: $(BZ_APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Lets you take a photo or video to post or send from a lite view. Nothing is uploaded except what you choose to send to that site."
        NSPhotoLibraryUsageDescription: "Lets you pick photos or videos to post or send from a lite view."
        NSPhotoLibraryAddUsageDescription: "Lets you save photos or videos you download in a lite view."
        NSMicrophoneUsageDescription: "Lets you record a video with sound to post or send from a lite view."
        CFBundleURLTypes:
          - CFBundleURLName: $(BZ_BUNDLE_ID)
            CFBundleURLSchemes: [breakzero]
    # No entitlements here: project-screen-time.yml sets CODE_SIGN_ENTITLEMENTS for the full app.

  breakZeroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: breakZero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BZ_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  breakZero:
    build:
      targets:
        breakZero: all
    test:
      targets:
        - breakZeroTests
        - package: BreakZeroKit/CoreTests
        - package: BreakZeroKit/LiteWebTests
        - package: BreakZeroKit/ShieldingTests
    run:
      config: Debug
